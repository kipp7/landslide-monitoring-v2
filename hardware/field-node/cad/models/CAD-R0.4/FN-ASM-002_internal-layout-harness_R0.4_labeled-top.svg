ext x="223.15" y="857.00" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#006879" text-anchor="end">XLS1 RF</text><text x="724.58" y="1200.25" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7a271a" text-anchor="end">DC5521</text><text x="724.58" y="587.70" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#344054" text-anchor="end">2 x RS485</text><text x="1510.00" y="170.00" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start">LAYOUT KEY</text><text x="1510.00" y="225.00" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">1  Carrier assembly</text><text x="1510.00" y="259.00" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#455468" text-anchor="start">PCB 115 x 170; installed envelope 35 mm; 4 x dia 3.2</text><text x="1510.00" y="316.00" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">2  Battery + tray</text><text x="1510.00" y="350.00" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#455468" text-anchor="start">66 x 61 x 40 mm battery; cable exits upper-left toward center</text><text x="1510.00" y="407.00" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">3  CN3791 + clip zone</text><text x="1510.00" y="441.00" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#455468" text-anchor="start">46 x 21 x 10 mm; connectors on both short ends; no holes</text><text x="1510.00" y="498.00" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">4  Tilt transmitter</text><text x="1510.00" y="532.00" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#455468" text-anchor="start">90 x 58 x 36 mm on local 120 x 85 x 3 mm steel plate</text><text x="1510.00" y="589.00" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">5  Fuse/service zone</text><text x="1510.00" y="623.00" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#455468" text-anchor="start">Required between battery load output and PCB DC5521</text><text x="1510.00" y="680.00" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="start">H1-H8</text><text x="1510.00" y="714.00" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#455468" text-anchor="start">FR4-to-enclosure only: 8 x dia 3.5; nominal, verify physically</text><text x="1510.00" y="805.00" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start">HARNESS TOPOLOGY</text><text x="1510.00" y="850.00" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#344054" text-anchor="start">PV panel -&gt; CN3791 -&gt; battery charge branch</text><text x="1510.00" y="888.00" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#344054" text-anchor="start">Battery load -&gt; fuse/service disconnect -&gt; PCB DC5521</text><text x="1510.00" y="926.00" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#344054" text-anchor="start">Tilt + soil RS485 -&gt; two PCB RS485 inputs</text><text x="1510.00" y="964.00" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#344054" text-anchor="start">GNSS and XLS1 use separate RF bulkheads</text><text x="1510.00" y="1030.00" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start">MECHANICAL CHECK</text><text x="1510.00" y="1072.00" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172033" text-anchor="start">8 anchors improve lift/twist restraint, but X support pitch is only 120.3 mm.</text><text x="1510.00" y="1108.00" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172033" text-anchor="start">Add four optional 12 x 12 x 6 mm compliant edge pads at X=+/-126 mm.</text><text x="1510.00" y="1144.00" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7a271a" text-anchor="start">Anchor heads fall under module footprints: fasten FR4 first; use raised trays/standoffs.</text><text x="1510.00" y="1230.00" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#b42318" text-anchor="start">BLOCKED BEFORE MANUFACTURE</text><text x="1510.00" y="1273.00" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#7a271a" text-anchor="start">Confirm H1-H8 XY from one physical datum, boss depth/blind state and top coplanarity.</text><text x="1510.00" y="1309.00" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#7a271a" text-anchor="start">Confirm cable OD, gland thread, SMA/TNC bulkhead choice and bend radius.</text><text x="1510.00" y="1345.00" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7a271a" text-anchor="start">Fit the 272 x 193 template; no FR4 DXF is released by CAD-R0.4.</text><text x="80.00" y="1690.00" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#455468" text-anchor="start">Nominal enclosure inner rectangle: 276.0655 x 197 mm. Scallops/ribs are still omitted from the tray reference.</text><text x="80.00" y="1730.00" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#455468" text-anchor="start">Gland = waterproof cable entry that seals and strain-relieves the cable jacket; RF uses a bulkhead connector instead.</text></svg>