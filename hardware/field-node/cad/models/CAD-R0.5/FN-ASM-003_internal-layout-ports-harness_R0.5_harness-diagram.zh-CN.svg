<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1600" viewBox="0 0 2600 1600"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#263241" /></marker></defs><rect x="0" y="0" width="2600" height="1600" fill="#ffffff" /><text x="80" y="70" font-family="Microsoft YaHei, Arial, sans-serif" font-size="44" font-weight="700" fill="#172033" text-anchor="start">FN-ASM-003 线束连接图</text><text x="80" y="116" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#b42318" text-anchor="start">CAD-R0.5 | W1-W8 与箱壁接口一一对应 | 仅供装配评审</text><text x="80" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start">电源链路</text><rect x="80" y="245" width="280" height="105" rx="6" fill="#fff4cc" stroke="#263241" stroke-width="3" /><text x="220.0" y="290" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">太阳能板</text><text x="220.0" y="327" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">箱外，先做滴水弯</text><rect x="440" y="245" width="220" height="105" rx="6" fill="#edf2f7" stroke="#263241" stroke-width="3" /><text x="550.0" y="290" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">G1</text><text x="550.0" y="327" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">M16格兰头</text><rect x="750" y="245" width="300" height="105" rx="6" fill="#d9ebff" stroke="#263241" stroke-width="3" /><text x="900.0" y="290" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">CN3791</text><text x="900.0" y="327" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">PV IN / BAT OUT</text><rect x="1170" y="245" width="300" height="105" rx="6" fill="#ffe2e0" stroke="#263241" stroke-width="3" /><text x="1320.0" y="290" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">电池充电口</text><text x="1320.0" y="327" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">防反插插头</text><line x1="360" y1="298" x2="440" y2="298" stroke="#e58a00" stroke-width="10" marker-end="url(#arrow)" /><rect x="359.0" y="270.0" width="82" height="35" rx="4" fill="#ffffff" stroke="#e58a00" stroke-width="2" /><text x="400.0" y="295.0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#e58a00" text-anchor="middle">W1</text><line x1="660" y1="298" x2="750" y2="298" stroke="#e58a00" stroke-width="10" marker-end="url(#arrow)" /><rect x="664.0" y="270.0" width="82" height="35" rx="4" fill="#ffffff" stroke="#e58a00" stroke-width="2" /><text x="705.0" y="295.0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#e58a00" text-anchor="middle">W1</text><line x1="1050" y1="298" x2="1170" y2="298" stroke="#c62828" stroke-width="10" marker-end="url(#arrow)" /><rect x="1069.0" y="270.0" width="82" height="35" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="2" /><text x="1110.0" y="295.0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#c62828" text-anchor="middle">W2</text><rect x="80" y="440" width="310" height="105" rx="6" fill="#ffe2e0" stroke="#263241" stroke-width="3" /><text x="235.0" y="485" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">电池负载输出</text><text x="235.0" y="522" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">与充电口分支定义待确认</text><rect x="520" y="440" width="310" height="105" rx="6" fill="#fff4cc" stroke="#263241" stroke-width="3" /><text x="675.0" y="485" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">保险 + 维护断开</text><text x="675.0" y="522" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">靠近电池正极</text><rect x="980" y="440" width="340" height="105" rx="6" fill="#dff1e4" stroke="#263241" stroke-width="3" /><text x="1150.0" y="485" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">PCB DC5521</text><text x="1150.0" y="522" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">载板电源输入</text><line x1="390" y1="493" x2="520" y2="493" stroke="#9f1239" stroke-width="10" marker-end="url(#arrow)" /><rect x="414.0" y="465.0" width="82" height="35" rx="4" fill="#ffffff" stroke="#9f1239" stroke-width="2" /><text x="455.0" y="490.0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#9f1239" text-anchor="middle">W3</text><line x1="830" y1="493" x2="980" y2="493" stroke="#9f1239" stroke-width="10" marker-end="url(#arrow)" /><rect x="864.0" y="465.0" width="82" height="35" rx="4" fill="#ffffff" stroke="#9f1239" stroke-width="2" /><text x="905.0" y="490.0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#9f1239" text-anchor="middle">W4</text><text x="80" y="675" font-family="Microsoft YaHei, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start">RS485 链路</text><rect x="80" y="715" width="310" height="105" rx="6" fill="#ffe3c2" stroke="#263241" stroke-width="3" /><text x="235.0" y="760" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">倾角变送器</text><text x="235.0" y="797" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">安装在箱内局部钢板</text><rect x="980" y="715" width="340" height="105" rx="6" fill="#dff1e4" stroke="#263241" stroke-width="3" /><text x="1150.0" y="760" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">PCB RS485-1</text><text x="1150.0" y="797" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">V+ / GND / A / B</text><line x1="390" y1="768" x2="980" y2="768" stroke="#7b3fb2" stroke-width="10" marker-end="url(#arrow)" /><rect x="644.0" y="740.0" width="82" height="35" rx="4" fill="#ffffff" stroke="#7b3fb2" stroke-width="2" /><text x="685.0" y="765.0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#7b3fb2" text-anchor="middle">W5</text><rect x="80" y="885" width="310" height="105" rx="6" fill="#d7e8ff" stroke="#263241" stroke-width="3" /><text x="235.0" y="930" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">土壤传感器</text><text x="235.0" y="967" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">箱外</text><rect x="500" y="885" width="220" height="105" rx="6" fill="#edf2f7" stroke="#263241" stroke-width="3" /><text x="610.0" y="930" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">G2</text><text x="610.0" y="967" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">M16格兰头</text><rect x="980" y="885" width="340" height="105" rx="6" fill="#dff1e4" stroke="#263241" stroke-width="3" /><text x="1150.0" y="930" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">PCB RS485-2</text><text x="1150.0" y="967" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">V+ / GND / A / B</text><line x1="390" y1="938" x2="500" y2="938" stroke="#1559a6" stroke-width="10" marker-end="url(#arrow)" /><rect x="404.0" y="910.0" width="82" height="35" rx="4" fill="#ffffff" stroke="#1559a6" stroke-width="2" /><text x="445.0" y="935.0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1559a6" text-anchor="middle">W6</text><line x1="720" y1="938" x2="980" y2="938" stroke="#1559a6" stroke-width="10" marker-end="url(#arrow)" /><rect x="809.0" y="910.0" width="82" height="35" rx="4" fill="#ffffff" stroke="#1559a6" stroke-width="2" /><text x="850.0" y="935.0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1559a6" text-anchor="middle">W6</text><text x="80" y="1120" font-family="Microsoft YaHei, Arial, sans-serif" font-size="31" font-weight="700" fill="#172033" text-anchor="start">射频链路</text><rect x="80" y="1160" width="310" height="105" rx="6" fill="#fff4cc" stroke="#263241" stroke-width="3" /><text x="235.0" y="1205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">BT-760 GNSS天线</text><text x="235.0" y="1242" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">TNC-K，箱外侧翼</text><rect x="500" y="1160" width="220" height="105" rx="6" fill="#edf2f7" stroke="#263241" stroke-width="3" /><text x="610.0" y="1205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">RF1</text><text x="610.0" y="1242" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">SMA穿板座</text><rect x="980" y="1160" width="340" height="105" rx="6" fill="#dff1e4" stroke="#263241" stroke-width="3" /><text x="1150.0" y="1205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">PCB GNSS接口</text><text x="1150.0" y="1242" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">50 ohm / 非RP-SMA</text><line x1="390" y1="1213" x2="500" y2="1213" stroke="#9a6700" stroke-width="10" marker-end="url(#arrow)" /><rect x="404.0" y="1185.0" width="82" height="35" rx="4" fill="#ffffff" stroke="#9a6700" stroke-width="2" /><text x="445.0" y="1210.0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#9a6700" text-anchor="middle">W7</text><line x1="720" y1="1213" x2="980" y2="1213" stroke="#9a6700" stroke-width="10" marker-end="url(#arrow)" /><rect x="809.0" y="1185.0" width="82" height="35" rx="4" fill="#ffffff" stroke="#9a6700" stroke-width="2" /><text x="850.0" y="1210.0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#9a6700" text-anchor="middle">W7</text><rect x="80" y="1330" width="310" height="105" rx="6" fill="#d5f5f2" stroke="#263241" stroke-width="3" /><text x="235.0" y="1375" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">XLS1外置天线</text><text x="235.0" y="1412" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">接口型号待样品确认</text><rect x="500" y="1330" width="220" height="105" rx="6" fill="#edf2f7" stroke="#263241" stroke-width="3" /><text x="610.0" y="1375" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">RF2</text><text x="610.0" y="1412" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">SMA穿板座</text><rect x="980" y="1330" width="340" height="105" rx="6" fill="#dff1e4" stroke="#263241" stroke-width="3" /><text x="1150.0" y="1375" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">PCB XLS1接口</text><text x="1150.0" y="1412" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#455468" text-anchor="middle">50 ohm / 非RP-SMA</text><line x1="390" y1="1383" x2="500" y2="1383" stroke="#008b9b" stroke-width="10" marker-end="url(#arrow)" /><rect x="404.0" y="1355.0" width="82" height="35" rx="4" fill="#ffffff" stroke="#008b9b" stroke-width="2" /><text x="445.0" y="1380.0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#008b9b" text-anchor="middle">W8</text><line x1="720" y1="1383" x2="980" y2="1383" stroke="#008b9b" stroke-width="10" marker-end="url(#arrow)" /><rect x="809.0" y="1355.0" width="82" height="35" rx="4" fill="#ffffff" stroke="#008b9b" stroke-width="2" /><text x="850.0" y="1380.0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#008b9b" text-anchor="middle">W8</text><rect x="1530" y="220" width="980" height="1190" rx="6" fill="#f7f9fb" stroke="#6b7788" stroke-width="3" /><text x="1590" y="285" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="700" fill="#172033" text-anchor="start">怎么读这张图</text><text x="1590" y="350" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="400" fill="#344054" text-anchor="start">1. W编号是整条线束，不是单根导线。</text><text x="1590" y="408" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="400" fill="#344054" text-anchor="start">2. G1/G2负责防水和抗拉，不承担电连接。</text><text x="1590" y="466" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="400" fill="#344054" text-anchor="start">3. RF1/RF2是射频连接器，不能换成普通格兰头。</text><text x="1590" y="524" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="400" fill="#344054" text-anchor="start">4. W3必须先经过保险/维护断开，再进入PCB。</text><text x="1590" y="582" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="400" fill="#344054" text-anchor="start">5. RS485每路至少四芯：电源正、地、A、B。</text><text x="1590" y="640" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="400" fill="#344054" text-anchor="start">6. GNSS与XLS1各走独立50 ohm同轴，不与电源共束。</text><text x="1590" y="760" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#b42318" text-anchor="start">制造前未冻结项</text><text x="1590" y="825" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="400" fill="#7a271a" text-anchor="start">G1/G2：根据实测电缆外径选择M12/M16及夹紧范围。</text><text x="1590" y="883" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="400" fill="#7a271a" text-anchor="start">RF1/RF2：根据到货穿板座确认螺纹、扳手位与最终孔径。</text><text x="1590" y="941" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="400" fill="#7a271a" text-anchor="start">W1-W6：确认额定电流、线规、颜色和端子型号。</text><text x="1590" y="999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="400" fill="#7a271a" text-anchor="start">W7/W8：确认接头公母、非RP-SMA、最小弯曲半径。</text><text x="1590" y="1057" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="400" fill="#7a271a" text-anchor="start">所有箱外连接完成后执行淋雨、拉力和通断测试。</text><text x="1590" y="1250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#7a271a" text-anchor="start">注意：本图是连接关系与布线路径图，不替代电气原理图。</text><text x="1590" y="1290" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#7a271a" text-anchor="start">极性、保险额定值和CN3791端子定义必须按实物丝印/手册核对。</text></svg>