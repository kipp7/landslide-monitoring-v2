<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs><style>
    text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;letter-spacing:0}.t{font-size:25px;font-weight:700;fill:#fff}.b{font-size:17px;font-weight:650;fill:#fff}.s{font-size:15px;fill:#e5edf6}.a{fill:none;stroke:#4dd0a7;stroke-width:3;marker-end:url(#m)}.o{fill:none;stroke:#fbbf24;stroke-width:3;marker-end:url(#mo)}.p{fill:#0b1e32;fill-opacity:.88;stroke:#6e859e;stroke-width:1.5}.warn{fill:#4a3107;fill-opacity:.92;stroke:#fbbf24;stroke-width:1.5}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#4dd0a7"/></marker><marker id="mo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#fbbf24"/></marker></defs>
  <rect x="32" y="30" width="680" height="94" rx="6" class="p"/><text x="58" y="70" class="t">IMAGE2-R0.2 / 外部整机工程标注</text><text x="58" y="100" class="s">绿色：已确认结构关系　黄色：待实测后冻结</text>
  <rect x="42" y="150" width="350" height="102" rx="6" class="p"/><text x="62" y="182" class="b">SWM-10W 太阳能板</text><text x="62" y="208" class="s">290 × 240 × 17 mm · 0.67 kg</text><text x="62" y="234" class="s">独立承重，不压在箱盖上</text><path d="M392 205L704 310" class="a"/>
  <rect x="54" y="720" width="350" height="104" rx="6" class="p"/><text x="74" y="752" class="b">防水箱</text><text x="74" y="778" class="s">320 × 240 × 145 mm</text><text x="74" y="804" class="s">由背架横梁承重，不由面板悬挂</text><path d="M404 772L630 760" class="a"/>
  <rect x="1380" y="80" width="490" height="130" rx="6" class="p"/><text x="1404" y="113" class="b">GNSS 固定侧翼平台</text><text x="1404" y="139" class="s">BT-760 + BT-M87SF 三孔法兰</text><text x="1404" y="165" class="s">相位中心固定，高于面板遮挡线</text><text x="1404" y="191" class="s">3 m / 50 Ω 馈线向下滴水弯</text><path d="M1400 214L1510 245" class="a"/>
  <rect x="1400" y="675" width="452" height="140" rx="6" class="warn"/><text x="1422" y="708" class="b">制造冻结前必须实测</text><text x="1422" y="734" class="s">面板边框孔位、箱体背孔、背架横梁长度、</text><text x="1422" y="760" class="s">BT-M87SF 三孔坐标、现场杆径与风载。</text><text x="1422" y="790" class="s">本图不可用于直接钻孔或下单支架。</text><path d="M1400 730L1254 596" class="o"/>
  <rect x="688" y="946" width="660" height="76" rx="6" class="p"/><text x="716" y="978" class="b">共背架三条独立受力路径</text><text x="716" y="1004" class="s">太阳能板 → 背脊；防水箱 → 横梁 → 背脊；GNSS 平台 → 背脊</text>
