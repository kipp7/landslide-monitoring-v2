<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs><style>
    text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;letter-spacing:0}.t{font-size:25px;font-weight:700;fill:#fff}.b{font-size:17px;font-weight:650;fill:#fff}.s{font-size:15px;fill:#e5edf6}.a{fill:none;stroke:#4dd0a7;stroke-width:3;marker-end:url(#m)}.o{fill:none;stroke:#fbbf24;stroke-width:3;marker-end:url(#mo)}.p{fill:#0b1e32;fill-opacity:.88;stroke:#6e859e;stroke-width:1.5}.warn{fill:#4a3107;fill-opacity:.92;stroke:#fbbf24;stroke-width:1.5}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#4dd0a7"/></marker><marker id="mo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#fbbf24"/></marker></defs>
  <rect x="32" y="30" width="720" height="94" rx="6" class="p"/><text x="58" y="70" class="t">IMAGE2-R0.2 / 箱内布局工程标注</text><text x="58" y="100" class="s">标注的是功能分区与已知包络，不是 Image 2 自动生成的孔位</text>
  <rect x="44" y="165" width="410" height="130" rx="6" class="p"/><text x="66" y="198" class="b">倾角测量区</text><text x="66" y="224" class="s">倾角：90 × 58 × 36 mm</text><text x="66" y="250" class="s">局部基准板：304，120 × 85 × 3 mm</text><text x="66" y="276" class="s">四点支撑；禁止整块钢底板</text><path d="M454 238L620 340" class="a"/>
  <rect x="1370" y="185" width="500" height="134" rx="6" class="p"/><text x="1393" y="218" class="b">主载板功能区</text><text x="1393" y="244" class="s">PCB：170 × 115 mm</text><text x="1393" y="270" class="s">RK2206、DL-XLS1、UM220-IV NK、</text><text x="1393" y="296" class="s">SC16IS752、2 × 隔离 RS485</text><path d="M1370 282L1110 350" class="a"/>
  <rect x="600" y="820" width="750" height="116" rx="6" class="p"/><text x="626" y="853" class="b">下侧维护 / 电源带</text><text x="626" y="879" class="s">3S 11.1 V / 5000 mAh 电池托盘 + CN3791 候选模块 + 主保险 + XT30 + 线槽</text><text x="626" y="906" class="s">电池和 CN3791 外形仍为 TBD；不得从本图推断孔位或电池尺寸</text><path d="M970 820L980 730" class="a"/>
  <rect x="1336" y="690" width="530" height="126" rx="6" class="warn"/><text x="1360" y="722" class="b">必须按工程图复核</text><text x="1360" y="748" class="s">Image 2 图只用于模块关系、维护方向与视觉检查。</text><text x="1360" y="774" class="s">箱体 6 孔坐标、FR4 异形轮廓、电池/充电板包络</text><text x="1360" y="800" class="s">尚未实测，不能依赖渲染加工。</text><path d="M1336 752L1266 690" class="o"/>
