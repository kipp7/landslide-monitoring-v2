<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs><style>
    text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;letter-spacing:0}.t{font-size:25px;font-weight:700;fill:#fff}.b{font-size:17px;font-weight:650;fill:#fff}.s{font-size:15px;fill:#e5edf6}.a{fill:none;stroke:#4dd0a7;stroke-width:3;marker-end:url(#m)}.o{fill:none;stroke:#fbbf24;stroke-width:3;marker-end:url(#mo)}.p{fill:#0b1e32;fill-opacity:.88;stroke:#6e859e;stroke-width:1.5}.warn{fill:#4a3107;fill-opacity:.92;stroke:#fbbf24;stroke-width:1.5}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#4dd0a7"/></marker><marker id="mo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#fbbf24"/></marker></defs>
  <rect x="32" y="30" width="720" height="94" rx="6" class="p"/><text x="58" y="70" class="t">IMAGE2-R0.2 / 机械爆炸层级标注</text><text x="58" y="100" class="s">重点验证：FR4 主安装板与局部 304 倾角基准板不是同一块板</text>
  <rect x="86" y="190" width="385" height="126" rx="6" class="p"/><text x="110" y="223" class="b">局部倾角基准件</text><text x="110" y="249" class="s">304 不锈钢：120 × 85 × 3 mm</text><text x="110" y="275" class="s">仅约为 FR4 面积的 21%</text><text x="110" y="301" class="s">上装 90 × 58 × 36 mm 倾角传感器</text><path d="M471 259L940 245" class="a"/>
  <rect x="1370" y="420" width="450" height="114" rx="6" class="p"/><text x="1394" y="453" class="b">异形 FR4/G10 主安装板</text><text x="1394" y="479" class="s">最大包络：265 × 185 × 3 mm</text><text x="1394" y="505" class="s">PCB、电池托盘、充电/保险均固定在此板</text><path d="M1370 474L1238 545" class="a"/>
  <rect x="1300" y="790" width="550" height="126" rx="6" class="p"/><text x="1324" y="823" class="b">箱体固定路径</text><text x="1324" y="849" class="s">FR4 → 隔离套 / 限深 M3 自攻 → 低位塑料孔柱</text><text x="1324" y="875" class="s">孔中心、孔深和贯通状态需实测；不可按渲染钻孔</text><text x="1324" y="901" class="s">倾角小板通过四个独立刚性支撑落到 FR4</text><path d="M1300 844L1135 778" class="a"/>
  <rect x="70" y="785" width="470" height="122" rx="6" class="warn"/><text x="94" y="818" class="b">明确禁止</text><text x="94" y="844" class="s">不得把局部银色小板理解为整块铁底板。</text><text x="94" y="870" class="s">全尺寸钢板会增加重量和塑料孔柱长期载荷，</text><text x="94" y="896" class="s">同时增加 GPS / DL-XLS1 的 RF 风险。</text><path d="M540 846L774 640" class="o"/>
</svg>
