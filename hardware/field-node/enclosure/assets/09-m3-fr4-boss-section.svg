<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; letter-spacing: 0; }
      .title { font-size: 38px; font-weight: 700; fill: #16212d; }
      .sub { font-size: 22px; fill: #475467; }
      .label { font-size: 24px; font-weight: 650; fill: #1d2939; }
      .note { font-size: 20px; fill: #344054; }
      .small { font-size: 18px; fill: #475467; }
      .leader { fill: none; stroke: #667085; stroke-width: 3; }
      .dim { fill: none; stroke: #175cd3; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#175cd3"/>
    </marker>
    <pattern id="fr4" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#d7f0e4"/>
      <path d="M-4 16 L16 -4 M4 20 L20 4" stroke="#85c9aa" stroke-width="2"/>
    </pattern>
    <pattern id="plastic" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#eef1f4"/>
      <path d="M0 18 L18 0" stroke="#c7cdd4" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#f7f8fa"/>
  <text x="70" y="78" class="title">箱体低位柱 / FR4 固定切面（MECH-R0.2-DRAFT）</text>
  <text x="70" y="116" class="sub">适用于选定 P1-P6；只冻结装配层级，不冻结螺钉长度、隔离套高度或孔深。单位：mm。</text>

  <rect x="70" y="155" width="1050" height="760" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="3"/>

  <!-- Screw and washer -->
  <rect x="420" y="205" width="230" height="42" rx="6" fill="#cbd5df" stroke="#475467" stroke-width="3"/>
  <rect x="505" y="247" width="60" height="360" fill="#b9c5d1" stroke="#475467" stroke-width="3"/>
  <path d="M505 282 L565 305 M505 315 L565 338 M505 348 L565 371 M505 381 L565 404 M505 414 L565 437 M505 447 L565 470 M505 480 L565 503 M505 513 L565 536 M505 546 L565 569" stroke="#7b8794" stroke-width="3"/>
  <rect x="390" y="270" width="290" height="24" rx="5" fill="#d7dee6" stroke="#475467" stroke-width="3"/>

  <!-- FR4 and spacer -->
  <rect x="185" y="315" width="700" height="90" fill="url(#fr4)" stroke="#027a48" stroke-width="4"/>
  <rect x="455" y="405" width="160" height="100" fill="#fff7d6" stroke="#b7791f" stroke-width="4"/>
  <path d="M505 405 V505 M565 405 V505" stroke="#b7791f" stroke-width="3"/>

  <!-- Plastic boss and enclosure floor -->
  <path d="M120 760 H950 V865 H120 Z" fill="url(#plastic)" stroke="#667085" stroke-width="4"/>
  <path d="M430 760 V565 Q430 520 475 520 H595 Q640 520 640 565 V760 Z" fill="url(#plastic)" stroke="#667085" stroke-width="4"/>
  <path d="M505 520 V675 Q505 705 535 705 Q565 705 565 675 V520" fill="#ffffff" stroke="#667085" stroke-width="3"/>
  <path d="M505 590 L565 613 M505 623 L565 646 M505 656 L560 678" stroke="#7b8794" stroke-width="3"/>

  <!-- Dimension annotations -->
  <line x1="905" y1="315" x2="905" y2="405" class="dim"/>
  <text x="928" y="368" class="label">3.0 FR4/G10</text>

  <line x1="690" y1="405" x2="690" y2="520" class="dim"/>
  <text x="715" y="466" class="label">H1 = 隔离套高度，实测</text>

  <line x1="700" y1="520" x2="700" y2="760" class="dim"/>
  <text x="725" y="660" class="label">H2 = 塑料柱高度，实测</text>

  <path d="M650 226 H835" class="leader"/>
  <text x="850" y="234" class="label">M3 盘头自攻螺钉</text>
  <text x="850" y="263" class="small">长度 L 由孔深与装配层级反算</text>

  <path d="M680 282 H835" class="leader"/>
  <text x="850" y="290" class="label">M3 平垫</text>

  <path d="M615 455 H835" class="leader"/>
  <text x="850" y="515" class="label">刚性隔离套</text>
  <text x="850" y="544" class="small">尼龙 / POM；六点等高，禁止软泡棉</text>

  <path d="M640 566 H835" class="leader"/>
  <text x="850" y="600" class="label">箱体低位塑料柱</text>
  <text x="850" y="629" class="small">现有底孔口述约 Ø2；商家配 M3 自攻</text>

  <path d="M565 690 H835" class="leader"/>
  <text x="850" y="700" class="label">盲孔有效咬合深度 D</text>
  <text x="850" y="729" class="small">需用深度针逐个测 P1-P6</text>

  <text x="130" y="835" class="note">箱体底壁：不得让螺钉触底、顶白、开裂或穿透</text>

  <!-- Right requirements panel -->
  <rect x="1160" y="155" width="570" height="760" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="3"/>
  <text x="1200" y="213" class="title" style="font-size:30px">长度冻结规则</text>
  <text x="1200" y="270" class="label">FR4 通孔</text>
  <text x="1200" y="305" class="note">6 × Ø3.5；不在 FR4 上攻牙</text>

  <text x="1200" y="365" class="label">螺钉长度 L</text>
  <text x="1200" y="400" class="note">L = 垫圈 + 3.0 + H1 + E</text>
  <text x="1200" y="433" class="note">E 为有效咬合长度，且 E &lt; D</text>
  <text x="1200" y="466" class="note">末端到孔底保留 ≥ 1.0 余量</text>

  <rect x="1195" y="510" width="500" height="130" rx="6" fill="#fff4e5" stroke="#f79009" stroke-width="3"/>
  <text x="1225" y="552" class="label">禁止现在直接买固定长度</text>
  <text x="1225" y="588" class="note">M3×8 / ×10 / ×12 都可能错误。</text>
  <text x="1225" y="620" class="note">先测 D、H2，再确定 H1 与 L。</text>

  <text x="1200" y="700" class="label">装配要求</text>
  <text x="1200" y="740" class="note">• 六个隔离套等高，FR4 不被拉弯</text>
  <text x="1200" y="775" class="note">• 低扭矩锁紧，做扭矩标记</text>
  <text x="1200" y="810" class="note">• 安装板不作为日常拆装螺纹</text>
  <text x="1200" y="845" class="note">• 首件完成 50 N 与 IP65 验证</text>

  <text x="70" y="964" class="sub">制造门槛：P1-P6 的统一基准坐标、柱高 H2、孔径、有效深度 D、盲孔状态和配套螺钉规格全部实测并复核。</text>
</svg>
